name: Test

on:
  push:
    branches:
      - trunk
    paths-ignore:
      - "**.md"
      - "**.txt"
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.txt"
  # Allow manually triggering the workflow.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest supported: PHP 7.3 + oldest WP.
          - php: "7.3"
            wp: "5.4"
          # Legacy PHP against latest WordPress.
          - php: "7.4"
            wp: "latest"
          # Compatibility middle: modern PHP against older supported WP.
          - php: "8.2"
            wp: "6.2"
          # Middle ground: PHP 8.2 + latest WP.
          - php: "8.2"
            wp: "latest"
          # Highest supported: PHP 8.4 + latest WP.
          - php: "8.4"
            wp: "latest"

    name: "PHP ${{ matrix.php }} - WP ${{ matrix.wp }}"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: false
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=10s --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: zend.assertions=1, error_reporting=-1, display_errors=On
          coverage: none

      - name: Set up WordPress
        run: phpunit/install.sh wordpress_test root '' 127.0.0.1:3306 ${{ matrix.wp }}

      # Use "highest" so Composer runs `update` to resolve dependencies
      # compatible with each PHP version in the matrix.
      # @link https://github.com/marketplace/actions/install-php-dependencies-with-composer
      - name: Install Composer dependencies
        uses: "ramsey/composer-install@v3"
        with:
          dependency-versions: highest
          custom-cache-suffix: $(date -u -d "-0 month -$(($(date +%d)-1)) days" "+%F")

      - name: Run the unit tests - single site
        run: vendor/bin/phpunit

      - name: Run the unit tests - multisite
        run: vendor/bin/phpunit
        env:
          WP_MULTISITE: 1
